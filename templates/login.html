{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<section class="container sec pt-5"><div class="row justify-content-center"><div class="col-md-8 col-lg-5 reveal"><div class="glass p-4 p-md-5">
 <h2><i class="bi bi-box-arrow-in-right text-info"></i> Login</h2>
 <p class="text-secondary">Sign in to analyse traffic and manage alerts.</p>
 {% if error %}<div class="alert alert-danger"><i class="bi bi-exclamation-triangle"></i> {{ error }}</div>{% endif %}
 <form method="POST" class="row g-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-12"><label class="form-label">Username</label><div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input name="username" class="form-control" autocomplete="username" required autofocus></div></div>
  <div class="col-12"><label class="form-label">Password</label><div class="input-group"><span class="input-group-text"><i class="bi bi-key"></i></span><input type="password" name="password" class="form-control" autocomplete="current-password" required></div></div>
  <div class="col-12"><button class="btn btn-neon glow w-100 py-3">Login</button></div>
 </form>
 <p class="text-secondary mt-4 mb-0 text-center">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div></div></div></section>
{% endblock %}

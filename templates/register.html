{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<section class="container sec pt-5"><div class="row justify-content-center"><div class="col-md-8 col-lg-5 reveal"><div class="glass p-4 p-md-5">
 <h2><i class="bi bi-person-plus text-info"></i> Create account</h2>
 <p class="text-secondary">Username: 3-32 letters, numbers or underscore. Password: 8+ characters.</p>
 {% if error %}<div class="alert alert-danger"><i class="bi bi-exclamation-triangle"></i> {{ error }}</div>{% endif %}
 <form method="POST" class="row g-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-12"><label class="form-label">Username</label><div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input name="username" class="form-control" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+"></div></div>
  <div class="col-12"><label class="form-label">Password</label><div class="input-group"><span class="input-group-text"><i class="bi bi-key"></i></span><input type="password" name="password" class="form-control" autocomplete="new-password" required minlength="8"></div></div>
  <div class="col-12"><label class="form-label">Confirm password</label><div class="input-group"><span class="input-group-text"><i class="bi bi-key-fill"></i></span><input type="password" name="confirm" class="form-control" autocomplete="new-password" required minlength="8"></div></div>
  <div class="col-12"><button class="btn btn-neon glow w-100 py-3">Register</button></div>
 </form>
 <p class="text-secondary mt-4 mb-0 text-center">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div></div></div></section>
{% endblock %}
